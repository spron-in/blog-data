# No startupProbe: crash recovery takes longer than the liveness window -> killed mid-redo, forever.
# Generated by scripts/gen.py from 00-baseline-postgres.yaml
apiVersion: v1
kind: Secret
metadata: {name: pg-secret}
type: Opaque
stringData: {POSTGRES_PASSWORD: s3cr3t-pass}
---
apiVersion: v1
kind: Service
metadata: {name: pg}
spec:
  clusterIP: None
  selector: {app: pg}
  ports:
  - {name: pg, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg}
spec:
  serviceName: pg
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      securityContext: {fsGroup: 999}
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - {containerPort: 5432, name: pg}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: pg-secret, key: POSTGRES_PASSWORD}
        resources:
          requests: {cpu: 200m, memory: 1Gi}
          limits: {cpu: 200m, memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql}
        readinessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        args: [-c, shared_buffers=256MB, -c, max_wal_size=8GB, -c, checkpoint_timeout=60min]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 2Gi}
