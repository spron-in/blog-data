# Same impatient livenessProbe, plus a slow /docker-entrypoint-initdb.d seed script (60s).
# Generated by scripts/gen.py from 00-baseline-mysql.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: mysql-seed}
data: {01-seed.sql: 'CREATE DATABASE app;

    CREATE TABLE app.customers (id INT PRIMARY KEY, name VARCHAR(64));

    INSERT INTO app.customers VALUES (1,''first'');

    -- stands in for loading a large dump

    SELECT SLEEP(60);

    INSERT INTO app.customers VALUES (2,''second'');

    CREATE TABLE app.seed_complete (ok INT);

    '}
---
apiVersion: v1
kind: Secret
metadata: {name: mysql-secret}
type: Opaque
stringData: {MYSQL_ROOT_PASSWORD: s3cr3t-pass}
---
apiVersion: v1
kind: Service
metadata: {name: mysql}
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
  - {name: mysql, port: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      securityContext: {fsGroup: 999}
      containers:
      - name: mysql
        image: mysql:8.4
        ports:
        - {containerPort: 3306, name: mysql}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: {name: mysql-secret, key: MYSQL_ROOT_PASSWORD}
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/mysql}
        - {name: seed, mountPath: /docker-entrypoint-initdb.d}
        readinessProbe:
          exec:
            command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [mysqladmin, ping, -h, 127.0.0.1, --silent]
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 2
      volumes:
      - name: seed
        configMap: {name: mysql-seed}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 2Gi}
