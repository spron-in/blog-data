# Start on postgres:17 with PGDATA pinned; later bump the image to postgres:18.
# Generated by scripts/gen.py from 00-baseline-postgres.yaml
apiVersion: v1
kind: Secret
metadata: {name: pg-secret}
type: Opaque
stringData: {POSTGRES_PASSWORD: s3cr3t-pass}
---
apiVersion: v1
kind: Service
metadata: {name: pg}
spec:
  clusterIP: None
  selector: {app: pg}
  ports:
  - {name: pg, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg}
spec:
  serviceName: pg
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      securityContext: {fsGroup: 999}
      containers:
      - name: postgres
        image: postgres:17
        ports:
        - {containerPort: 5432, name: pg}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: pg-secret, key: POSTGRES_PASSWORD}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        startupProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 2Gi}
