# Non-root postgres (runAsUser 999) on a root-owned volume with no fsGroup.
# Generated by scripts/gen.py from 00-baseline-postgres.yaml
apiVersion: v1
kind: Secret
metadata: {name: pg-secret}
type: Opaque
stringData: {POSTGRES_PASSWORD: s3cr3t-pass}
---
apiVersion: v1
kind: Service
metadata: {name: pg}
spec:
  clusterIP: None
  selector: {app: pg}
  ports:
  - {name: pg, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg}
spec:
  serviceName: pg
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      securityContext: {runAsUser: 999, runAsGroup: 999, runAsNonRoot: true}
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - {containerPort: 5432, name: pg}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: pg-secret, key: POSTGRES_PASSWORD}
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql}
        startupProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: simulate-root-owned
        image: busybox:1.37
        command: [sh, -c, 'chown 0:0 /data && chmod 755 /data']
        securityContext: {runAsUser: 0, runAsNonRoot: false}
        volumeMounts:
        - {name: data, mountPath: /data}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 2Gi}
