<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Where the time went: from creating the migration to the cutover">
<rect width="960" height="400" fill="#ffffff"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#161641">Where the time went: from creating the migration to the cutover</text>
<text x="24" y="54" font-size="14" fill="#6b7280">Minutes per phase (5s samples). Time spent in sync before we pressed Cutover is not included.</text>
<line x1="230.0" y1="78" x2="230.0" y2="280" stroke="#e5e7eb"/>
<text x="230.0" y="298" font-size="13" fill="#6b7280" text-anchor="middle">0 min</text>
<line x1="360.6" y1="78" x2="360.6" y2="280" stroke="#e5e7eb"/>
<text x="360.6" y="298" font-size="13" fill="#6b7280" text-anchor="middle">5 min</text>
<line x1="491.1" y1="78" x2="491.1" y2="280" stroke="#e5e7eb"/>
<text x="491.1" y="298" font-size="13" fill="#6b7280" text-anchor="middle">10 min</text>
<line x1="621.7" y1="78" x2="621.7" y2="280" stroke="#e5e7eb"/>
<text x="621.7" y="298" font-size="13" fill="#6b7280" text-anchor="middle">15 min</text>
<line x1="752.3" y1="78" x2="752.3" y2="280" stroke="#e5e7eb"/>
<text x="752.3" y="298" font-size="13" fill="#6b7280" text-anchor="middle">20 min</text>
<line x1="882.8" y1="78" x2="882.8" y2="280" stroke="#e5e7eb"/>
<text x="882.8" y="298" font-size="13" fill="#6b7280" text-anchor="middle">25 min</text>
<text x="218" y="119.0" font-size="14" fill="#161641" text-anchor="end" font-weight="600">A: 50 GiB, 47M keys</text>
<rect x="230.0" y="92" width="57.9" height="44" fill="#4f46e5"/>
<text x="258.9" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2.2</text>
<rect x="287.9" y="92" width="95.7" height="44" fill="#16a34a"/>
<text x="335.8" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3.7</text>
<rect x="383.6" y="92" width="132.7" height="44" fill="#f59e0b"/>
<text x="450.0" y="119.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">5.1</text>
<rect x="516.4" y="92" width="2.2" height="44" fill="#dc2626"/>
<rect x="518.5" y="92" width="8.7" height="44" fill="#0891b2"/>
<text x="535.2" y="119.0" font-size="13" fill="#161641">11.4 min</text>
<text x="218" y="189.0" font-size="14" fill="#161641" text-anchor="end" font-weight="600">B: 20 GiB, 150M keys</text>
<rect x="230.0" y="162" width="29.2" height="44" fill="#4f46e5"/>
<rect x="259.2" y="162" width="32.6" height="44" fill="#16a34a"/>
<rect x="291.8" y="162" width="546.2" height="44" fill="#f59e0b"/>
<text x="564.9" y="189.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">20.9</text>
<rect x="838.0" y="162" width="6.5" height="44" fill="#dc2626"/>
<rect x="844.5" y="162" width="24.4" height="44" fill="#0891b2"/>
<text x="876.9" y="189.0" font-size="13" fill="#161641">24.5 min</text>
<rect x="24" y="318" width="12" height="12" fill="#4f46e5" rx="2"/>
<text x="42" y="328" font-size="13" fill="#374151">preflight, wait for a running save</text>
<rect x="298.8" y="318" width="12" height="12" fill="#16a34a" rx="2"/>
<text x="316.8" y="328" font-size="13" fill="#374151">source snapshot + transfer</text>
<rect x="516.0" y="318" width="12" height="12" fill="#f59e0b" rx="2"/>
<text x="534.0" y="328" font-size="13" fill="#374151">load into Valkey</text>
<rect x="661.2" y="318" width="12" height="12" fill="#dc2626" rx="2"/>
<text x="679.2" y="328" font-size="13" fill="#374151">catch up</text>
<rect x="748.8000000000001" y="318" width="12" height="12" fill="#0891b2" rx="2"/>
<text x="766.8000000000001" y="328" font-size="13" fill="#374151">cutover</text>
</svg>
