apiVersion: v1
kind: ConfigMap
metadata: {name: redis-config, namespace: redis-legacy}
data:
  redis.conf: |
    port 6379
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 15000
    dir /data
    protected-mode no
    appendonly no
    save ""
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: redis-legacy}
spec:
  clusterIP: None
  selector: {app: redis-source}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: redis-legacy}
spec:
  serviceName: redis
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: redis-source}}
  template:
    metadata: {labels: {app: redis-source}}
    spec:
      nodeSelector: {lke.linode.com/pool-id: "1027849"}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: redis-source}}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis:7.2
        command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$PW\" --masterauth \"$PW\" --cluster-announce-ip \"$POD_IP\""]
        env:
        - {name: PW, valueFrom: {secretKeyRef: {name: redis-auth, key: password}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        ports: [{containerPort: 6379}, {containerPort: 16379}]
        resources:
          requests: {cpu: "3", memory: 24Gi}
          limits: {memory: 24Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: config, mountPath: /etc/redis}
      volumes:
      - name: config
        configMap: {name: redis-config}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: linode-block-storage
      resources: {requests: {storage: 60Gi}}
