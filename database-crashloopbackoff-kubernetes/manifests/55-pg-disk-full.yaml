# Data volume runs out of space. A 300Mi tmpfs stands in for a small PVC (local-path ignores size).
# Generated by scripts/gen.py from 00-baseline-postgres.yaml
apiVersion: v1
kind: Secret
metadata: {name: pg-secret}
type: Opaque
stringData: {POSTGRES_PASSWORD: s3cr3t-pass}
---
apiVersion: v1
kind: Service
metadata: {name: pg}
spec:
  clusterIP: None
  selector: {app: pg}
  ports:
  - {name: pg, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: pg}
spec:
  serviceName: pg
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      securityContext: {fsGroup: 999}
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - {containerPort: 5432, name: pg}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: pg-secret, key: POSTGRES_PASSWORD}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: 500m, memory: 1Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql}
        startupProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [pg_isready, -U, postgres, -h, 127.0.0.1]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        args: [-c, shared_buffers=128MB]
      volumes:
      - name: data
        emptyDir: {medium: Memory, sizeLimit: 300Mi}
